name: Angular CI/CD

# on: cuándo se ejecuta. En cada PR hacia main y en cada push a main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # build (CI): compila el proyecto en una máquina limpia.
  build:
    runs-on: ubuntu-latest
    # permissions: este job solo necesita leer el código.
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Si un test falla o la cobertura no llega al mínimo, el job termina en rojo.
      - name: Ejecutar tests con cobertura
        run: npx ng test --watch=false --coverage

      # if: se sube también cuando los tests fallan, para poder consultar el informe.
      - name: Subir informe de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage
          if-no-files-found: ignore

      - name: Compilar Angular
        run: npx ng build --base-href /cicd-angular/

      # if: en una PR no se publica nada, así que el artefacto solo se sube en push.
      - name: Subir artefacto de Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cicd-angular/browser

  # deploy (CD): publica en GitHub Pages lo que ha compilado build.
  deploy:
    # needs: espera a build y no arranca si build falla.
    needs: build
    # if: solo en push a main, nunca en una PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # permissions: los mínimos para publicar en Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
